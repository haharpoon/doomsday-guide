# Turn Wi-Fi powersave off.
# 2 = disabled. See NetworkManager.conf, key wifi.powersave.
#
# The working Pi had powersave off, and /etc/NetworkManager/conf.d on
# that card was empty, so the setting lived somewhere this snapshot
# did not keep (often inside a connection profile, and those profiles
# also hold the Wi-Fi password). This file is how a fresh card gets
# the same result. setup_pi.sh copies it into place.
[connection]
wifi.powersave = 2
