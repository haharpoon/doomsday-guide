# setup_pi.sh copies this to
# /etc/systemd/system/getty@tty1.service.d/autologin.conf
# and fills in the account that owns the deck.
# SSH is unchanged. The console on the screen (or HDMI) logs in on its own
# so the guide can open.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin YOUR_USER --noclear %I $TERM
